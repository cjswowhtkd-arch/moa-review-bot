<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모아리뷰 실시간 트렌드 허브</title>
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: #131926;
            --card-soft: #182033;
            --border-color: #26344f;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --text-muted: #64748b;
            --point-color: #06b6d4;
            --pink: #ec4899;
            --green: #22c55e;
            --yellow: #facc15;
            --gradient-accent: linear-gradient(135deg, #06b6d4, #3b82f6);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-title);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .header-section {
            text-align: center;
            margin: 25px 0 24px 0;
        }

        .header-section h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px 0;
        }

        .header-section p {
            color: var(--text-body);
            font-size: 14px;
            margin: 0;
        }

        .status-bar {
            max-width: 1200px;
            margin: 0 auto 18px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .status-pill {
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-body);
            border-radius: 8px;
            padding: 7px 10px;
            white-space: nowrap;
        }

        .tab-wrapper {
            max-width: 1200px;
            margin: 0 auto 24px auto;
            overflow-x: auto;
            display: flex;
            gap: 8px;
            padding: 5px 0 12px 0;
            -webkit-overflow-scrolling: touch;
        }

        .tab-wrapper::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 0 0 auto;
            background-color: var(--card-bg);
            color: var(--text-body);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .tab-btn.active {
            background: var(--gradient-accent);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .trend-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .trend-card:hover {
            transform: translateY(-4px);
            border-color: var(--point-color);
        }

        .thumb-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #0f1420;
            position: relative;
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .trend-card:hover .thumb-box img {
            transform: scale(1.04);
        }

        .rank-badge,
        .thumb-badge {
            position: absolute;
            background: rgba(9, 13, 22, 0.86);
            backdrop-filter: blur(4px);
            font-size: 11px;
            font-weight: 800;
            padding: 5px 9px;
            border-radius: 8px;
            max-width: calc(100% - 24px);
        }

        .rank-badge {
            top: 12px;
            left: 12px;
            color: var(--pink);
            border: 1px solid rgba(236, 72, 153, 0.34);
        }

        .thumb-badge {
            right: 12px;
            bottom: 12px;
            color: var(--green);
            border: 1px solid rgba(34, 197, 94, 0.34);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 10px;
        }

        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--text-muted);
            font-size: 11px;
            min-height: 22px;
        }

        .source-chip,
        .score-chip {
            background: var(--card-soft);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .source-chip {
            max-width: 64%;
        }

        .score-chip {
            color: var(--yellow);
            flex: 0 0 auto;
        }

        .card-body h3 {
            font-size: 15px;
            font-weight: 750;
            line-height: 1.42;
            margin: 0;
            color: var(--text-title);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-body p {
            font-size: 12.5px;
            color: var(--text-body);
            line-height: 1.5;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
        }

        .modal-window {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 520px;
            overflow: hidden;
            position: relative;
        }

        .modal-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #0f1420;
        }

        .modal-info {
            padding: 20px;
        }

        .modal-meta {
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.5;
            margin: 0 0 10px 0;
        }

        .modal-info h2 {
            font-size: 18px;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .modal-info p {
            color: var(--text-body);
            font-size: 13px;
            line-height: 1.6;
            margin: 0 0 20px 0;
        }

        .action-link {
            display: block;
            text-align: center;
            background: var(--gradient-accent);
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
        }

        .close-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 24px;
            color: white;
            cursor: pointer;
            z-index: 10;
            background: rgba(0, 0, 0, 0.55);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .empty-state {
            text-align: center;
            width: 100%;
            color: var(--text-body);
            font-size: 13px;
            grid-column: 1 / -1;
            padding: 32px 0;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .header-section h1 {
                font-size: 24px;
            }

            .status-bar {
                align-items: stretch;
                flex-direction: column;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header-section">
        <h1>모아리뷰 실시간 트렌드</h1>
        <p>Google, Daum, Naver, Kakao 소스 기반 TOP 20 종합 인덱스</p>
    </div>

    <div class="status-bar">
        <span id="syncStatus" class="status-pill">데이터 동기화 중</span>
        <span id="activeSummary" class="status-pill">TOP 20 준비 중</span>
    </div>

    <div class="tab-wrapper">
        <button id="tab-drama" class="tab-btn active" data-category="drama">드라마/웹툰</button>
        <button id="tab-tech" class="tab-btn" data-category="tech">IT/테크</button>
        <button id="tab-dessert" class="tab-btn" data-category="dessert">디저트 핫플</button>
        <button id="tab-news" class="tab-btn" data-category="news">주요 종합뉴스</button>
        <button id="tab-stock" class="tab-btn" data-category="stock">증시 특징주</button>
    </div>

    <div class="grid-container" id="cardGrid">
        <p class="empty-state">동적 데이터를 파싱하고 있습니다...</p>
    </div>

    <div id="detailModal" class="modal-overlay">
        <div class="modal-window">
            <span class="close-icon" id="closeModalBtn">&times;</span>
            <img id="modalImg" class="modal-thumb" src="" alt="뉴스 기사 이미지">
            <div class="modal-info">
                <div id="modalMeta" class="modal-meta"></div>
                <h2 id="modalTitle"></h2>
                <p id="modalContent"></p>
                <a id="modalGoBtn" href="#" target="_blank" rel="noopener noreferrer" class="action-link">검증 원문 기사 바로보기</a>
            </div>
        </div>
    </div>

    <script type="module">
        const dbEndpoint = "https://chosanghee00001-default-rtdb.firebaseio.com/categories.json";
        const maxItems = 20;
        const fallbackImages = {
            drama: "https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?auto=format&fit=crop&w=900&q=80",
            tech: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80",
            dessert: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=900&q=80",
            news: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=900&q=80",
            stock: "https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?auto=format&fit=crop&w=900&q=80"
        };

        let activeTab = "drama";
        let rawDataStore = {};

        const grid = document.getElementById("cardGrid");
        const syncStatus = document.getElementById("syncStatus");
        const activeSummary = document.getElementById("activeSummary");
        const modal = document.getElementById("detailModal");

        async function fetchSystem() {
            try {
                const url = `${dbEndpoint}?ts=${Date.now()}`;
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) throw new Error(`Firebase ${res.status}`);

                rawDataStore = await res.json() || {};
                syncStatus.textContent = `동기화 완료 ${formatTime(new Date())}`;
                paintCards();
            } catch (err) {
                syncStatus.textContent = "동기화 대기";
                showEmpty("실시간 트렌드를 동기화하는 데 대기 시간이 필요합니다.");
            }
        }

        function paintCards() {
            grid.innerHTML = "";

            const activeList = normalizeList(rawDataStore[activeTab]).slice(0, maxItems);
            activeSummary.textContent = `${categoryLabel(activeTab)} ${activeList.length}/${maxItems}`;

            if (activeList.length === 0) {
                showEmpty("현재 데이터가 비어있습니다. 로봇을 가동해 주세요.");
                return;
            }

            activeList.forEach((item, index) => {
                grid.appendChild(createCard(item, index));
            });
        }

        function createCard(item, index) {
            const rank = item.rank || index + 1;
            const card = document.createElement("article");
            card.className = "trend-card";
            card.addEventListener("click", () => openModal(item, rank));

            const thumbBox = document.createElement("div");
            thumbBox.className = "thumb-box";

            const rankBadge = document.createElement("span");
            rankBadge.className = "rank-badge";
            rankBadge.textContent = `TOP ${rank}`;

            const thumbBadge = document.createElement("span");
            thumbBadge.className = "thumb-badge";
            thumbBadge.textContent = thumbnailLabel(item.thumbnailSource);

            const img = document.createElement("img");
            img.src = safeUrl(item.img) || fallbackImages[activeTab];
            img.alt = item.title || "뉴스 기사 이미지";
            img.loading = "lazy";
            img.onerror = () => {
                img.onerror = null;
                img.src = fallbackImages[activeTab];
                thumbBadge.textContent = "대체 이미지";
            };

            thumbBox.append(rankBadge, img, thumbBadge);

            const body = document.createElement("div");
            body.className = "card-body";

            const metaRow = document.createElement("div");
            metaRow.className = "meta-row";

            const sourceChip = document.createElement("span");
            sourceChip.className = "source-chip";
            sourceChip.textContent = sourceLabel(item);

            const scoreChip = document.createElement("span");
            scoreChip.className = "score-chip";
            scoreChip.textContent = Number.isFinite(Number(item.score)) ? `${item.score}점` : "검증";

            metaRow.append(sourceChip, scoreChip);

            const title = document.createElement("h3");
            title.textContent = item.title || "제목 없음";

            const content = document.createElement("p");
            content.textContent = item.content || "원문 링크에서 상세 내용을 확인할 수 있습니다.";

            body.append(metaRow, title, content);
            card.append(thumbBox, body);
            return card;
        }

        function normalizeList(value) {
            const list = Array.isArray(value) ? value : Object.values(value || {});
            return list
                .filter(Boolean)
                .sort((a, b) => Number(a.rank || 999) - Number(b.rank || 999));
        }

        function showEmpty(message) {
            grid.innerHTML = "";
            const empty = document.createElement("p");
            empty.className = "empty-state";
            empty.textContent = message;
            grid.appendChild(empty);
        }

        function sourceLabel(item) {
            const count = Number(item.sourceCount || item.sources?.length || 0);
            const source = item.source || item.sources?.[0] || "검증 소스";
            return count > 1 ? `${source} 외 ${count - 1}` : source;
        }

        function thumbnailLabel(source) {
            if (source === "article-first-image") return "원문 첫 이미지";
            if (source === "og-image") return "대표 이미지";
            return "대체 이미지";
        }

        function categoryLabel(key) {
            const labels = {
                drama: "드라마/웹툰",
                tech: "IT/테크",
                dessert: "디저트 핫플",
                news: "주요 종합뉴스",
                stock: "증시 특징주"
            };
            return labels[key] || "트렌드";
        }

        function safeUrl(value) {
            try {
                const url = new URL(value);
                return ["http:", "https:"].includes(url.protocol) ? url.toString() : "";
            } catch {
                return "";
            }
        }

        function formatTime(date) {
            return new Intl.DateTimeFormat("ko-KR", {
                hour: "2-digit",
                minute: "2-digit"
            }).format(date);
        }

        function openModal(item, rank) {
            document.getElementById("modalImg").src = safeUrl(item.img) || fallbackImages[activeTab];
            document.getElementById("modalTitle").textContent = item.title || "제목 없음";
            document.getElementById("modalContent").textContent = item.content || "원문 링크에서 상세 내용을 확인할 수 있습니다.";
            document.getElementById("modalMeta").textContent =
                `TOP ${rank} · ${sourceLabel(item)} · ${Number.isFinite(Number(item.score)) ? `${item.score}점` : "검증 완료"} · ${thumbnailLabel(item.thumbnailSource)}`;
            document.getElementById("modalGoBtn").href = safeUrl(item.link) || "#";
            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        document.querySelectorAll(".tab-btn").forEach((button) => {
            button.addEventListener("click", () => {
                activeTab = button.dataset.category;
                document.querySelectorAll(".tab-btn").forEach((tab) => tab.classList.remove("active"));
                button.classList.add("active");
                paintCards();
            });
        });

        modal.addEventListener("click", (event) => {
            if (event.target === modal) closeModal();
        });

        document.getElementById("closeModalBtn").addEventListener("click", closeModal);
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeModal();
        });

        fetchSystem();
    </script>
</body>
</html>
