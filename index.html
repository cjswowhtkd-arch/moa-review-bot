<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모아리뷰 카페 인기글</title>
    <style>
        :root {
            --bg: #050608;
            --panel: #15171b;
            --panel-2: #1b1e24;
            --line: rgba(255, 255, 255, 0.08);
            --text: #f3f5f7;
            --muted: #a7adb7;
            --soft: #737b88;
            --accent: #ff3d68;
            --cyan: #36d7ff;
            --lime: #b7f36a;
            --nav: #20242a;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                linear-gradient(118deg, rgba(54, 215, 255, 0.24), transparent 24%),
                linear-gradient(72deg, transparent 18%, rgba(255, 61, 104, 0.28) 42%, transparent 68%),
                linear-gradient(165deg, transparent 8%, rgba(128, 87, 255, 0.24) 30%, transparent 52%),
                var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 26px 18px 34px;
            background:
                linear-gradient(180deg, transparent 0, rgba(5, 6, 8, 0.2) 230px, var(--bg) 390px),
                transparent;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 42px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.26);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.24);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0;
        }

        .sync-pill {
            color: rgba(255, 255, 255, 0.76);
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.28);
            border-radius: 999px;
            padding: 7px 10px;
            max-width: 210px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hero {
            text-align: center;
            padding: 38px 0 52px;
        }

        .hero-title {
            margin: 0;
            font-size: 44px;
            line-height: 1.08;
            font-weight: 900;
            letter-spacing: 0;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
        }

        .hero-sub {
            margin: 12px 0 0;
            color: rgba(255, 255, 255, 0.76);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.18em;
        }

        .hero-line {
            width: 54px;
            height: 5px;
            margin: 18px auto 0;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.52);
        }

        .tab-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 20px;
            margin: 0 -2px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tab-wrapper::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 0 0 auto;
            min-height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(14, 16, 20, 0.72);
            color: rgba(255, 255, 255, 0.78);
            padding: 0 16px;
            font-size: 13px;
            font-weight: 850;
            cursor: pointer;
        }

        .tab-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.36);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            margin: 0 2px 12px;
            font-size: 12px;
            font-weight: 800;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .trend-card {
            width: 100%;
            min-height: 142px;
            background: rgba(21, 23, 27, 0.96);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 108px;
            gap: 15px;
            align-items: center;
            box-shadow: 0 20px 36px rgba(0, 0, 0, 0.34);
            cursor: pointer;
        }

        .trend-card:active {
            transform: scale(0.99);
        }

        .card-copy {
            min-width: 0;
        }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #f2f4f7;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 12px;
        }

        .rank-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px rgba(255, 61, 104, 0.8);
            transform: translateY(-8px);
        }

        .card-title {
            margin: 0;
            color: var(--text);
            font-size: 16px;
            line-height: 1.45;
            font-weight: 820;
            overflow-wrap: anywhere;
            word-break: keep-all;
        }

        .card-desc {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
            font-weight: 800;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .thumb-box {
            width: 108px;
            height: 108px;
            border-radius: 8px;
            overflow: hidden;
            background: #252932;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            font-weight: 800;
            padding: 38px 0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.82);
            align-items: flex-end;
        }

        .modal-window {
            width: min(100%, 520px);
            margin: 0 auto;
            background: var(--panel);
            border-radius: 24px 24px 0 0;
            overflow: hidden;
            border: 1px solid var(--line);
        }

        .modal-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #222631;
        }

        .modal-info {
            padding: 20px;
        }

        .modal-meta {
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-info h2 {
            margin: 0 0 12px;
            font-size: 22px;
            line-height: 1.35;
        }

        .modal-info p {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            font-weight: 700;
        }

        .action-link {
            display: block;
            text-align: center;
            background: #fff;
            color: #050608;
            padding: 14px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
        }

        .close-icon {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            z-index: 2;
            cursor: pointer;
        }

        @media (min-width: 700px) {
            body {
                background-color: #111318;
            }

            .app-shell {
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
            }
        }

        @media (max-width: 380px) {
            .app-shell {
                padding-left: 14px;
                padding-right: 14px;
            }

            .trend-card {
                grid-template-columns: minmax(0, 1fr) 92px;
                gap: 14px;
                padding: 18px;
            }

            .thumb-box {
                width: 92px;
                height: 92px;
            }

            .card-title {
                font-size: 15px;
            }

            .card-desc {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="top-bar">
            <div class="brand-mark" aria-hidden="true">M</div>
            <div id="syncStatus" class="sync-pill">동기화 중</div>
        </header>

        <section class="hero">
            <h1 class="hero-title">카페<br>인기글</h1>
            <div class="hero-line"></div>
            <p class="hero-sub">NAVER CAFE HOT</p>
        </section>

        <nav class="tab-wrapper" aria-label="카테고리">
            <button id="tab-daily" class="tab-btn active" data-category="daily">실시간HOT</button>
            <button id="tab-weekly" class="tab-btn" data-category="weekly">주간TOP</button>
        </nav>

        <div class="summary-row">
            <span id="activeSummary">실시간HOT TOP 10</span>
            <span>카페 조회수 기반</span>
        </div>

        <section class="grid-container" id="cardGrid">
            <p class="empty-state">실시간 트렌드를 불러오는 중입니다.</p>
        </section>
    </main>

    <div id="detailModal" class="modal-overlay">
        <div class="modal-window">
            <span class="close-icon" id="closeModalBtn">&times;</span>
            <img id="modalImg" class="modal-thumb" src="" alt="카페 게시글 이미지" referrerpolicy="no-referrer">
            <div class="modal-info">
                <div id="modalMeta" class="modal-meta"></div>
                <h2 id="modalTitle"></h2>
                <p id="modalContent"></p>
                <a id="modalGoBtn" href="#" target="_blank" rel="noopener noreferrer" class="action-link">카페에서 보기</a>
            </div>
        </div>
    </div>

    <script type="module">
        const dbEndpoint = "https://chosanghee00001-default-rtdb.firebaseio.com/categories.json";
        const maxItems = 10;
        const syncIntervalMs = 60 * 60 * 1000;
        const defaultFallback = "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80";
        const fallbackImages = {
            daily: defaultFallback,
            weekly: defaultFallback,
        };

        let activeTab = "daily";
        let rawDataStore = {};

        const grid = document.getElementById("cardGrid");
        const syncStatus = document.getElementById("syncStatus");
        const activeSummary = document.getElementById("activeSummary");
        const modal = document.getElementById("detailModal");

        async function fetchSystem() {
            try {
                const url = `${dbEndpoint}?ts=${Date.now()}`;
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) throw new Error(`Firebase ${res.status}`);

                rawDataStore = await res.json() || {};
                syncStatus.textContent = `${formatTime(new Date())} 갱신`;
                paintCards();
            } catch (err) {
                syncStatus.textContent = "동기화 대기";
                showEmpty("실시간 트렌드를 동기화하는 데 대기 시간이 필요합니다.");
            }
        }

        function paintCards() {
            grid.innerHTML = "";
            const activeList = normalizeList(rawDataStore[activeTab]).slice(0, maxItems);
            activeSummary.textContent = `${categoryLabel(activeTab)} ${activeList.length}/${maxItems}`;

            if (activeList.length === 0) {
                showEmpty("현재 데이터가 비어있습니다. 수집기를 가동해 주세요.");
                return;
            }

            activeList.forEach((item, index) => {
                grid.appendChild(createCard(item, index));
            });
        }

        function createCard(item, index) {
            const rank = item.rank || index + 1;
            const card = document.createElement("article");
            card.className = "trend-card";
            card.setAttribute("role", "link");
            card.tabIndex = 0;
            card.addEventListener("click", () => openArticle(item));
            card.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openArticle(item);
                }
            });

            const copy = document.createElement("div");
            copy.className = "card-copy";

            const rankRow = document.createElement("div");
            rankRow.className = "rank-row";
            const rankText = document.createElement("span");
            rankText.textContent = String(rank).padStart(2, "0");
            const rankDot = document.createElement("span");
            rankDot.className = "rank-dot";
            rankRow.append(rankText, rankDot);

            const title = document.createElement("h2");
            title.className = "card-title";
            title.textContent = item.title || "제목 없음";

            const desc = document.createElement("p");
            desc.className = "card-desc";
            desc.textContent = sourceLabel(item);

            copy.append(rankRow, title, desc);

            const thumbBox = document.createElement("div");
            thumbBox.className = "thumb-box";

            const img = document.createElement("img");
            img.referrerPolicy = "no-referrer";
            img.src = safeUrl(item.img) || fallbackImages[activeTab] || defaultFallback;
            img.alt = item.title || "카페 게시글 이미지";
            img.loading = "lazy";
            img.onerror = () => {
                img.onerror = null;
                img.src = fallbackImages[activeTab] || defaultFallback;
            };

            thumbBox.appendChild(img);
            card.append(copy, thumbBox);
            return card;
        }

        function normalizeList(value) {
            const list = Array.isArray(value) ? value : Object.values(value || {});
            return list
                .filter(Boolean)
                .sort((a, b) => Number(a.rank || 999) - Number(b.rank || 999));
        }

        function showEmpty(message) {
            grid.innerHTML = "";
            const empty = document.createElement("p");
            empty.className = "empty-state";
            empty.textContent = message;
            grid.appendChild(empty);
        }

        function sourceLabel(item) {
            if (Number(item.readCount || 0) > 0) {
                const cafeName = item.cafeName || item.source || "네이버 카페";
                const read = formatCount(item.readCount);
                const comments = formatCount(item.commentCount || 0);
                const likes = formatCount(item.likeCount || 0);
                return `조회 ${read} · 좋아요 ${likes} · 댓글 ${comments} · ${cafeName}`;
            }

            const count = Number(item.sourceCount || item.sources?.length || 0);
            const source = item.source || item.sources?.[0] || "검증 소스";
            return count > 1 ? `${source} 외 ${count - 1}` : source;
        }

        function categoryLabel(key) {
            const labels = {
                daily: "실시간HOT",
                weekly: "주간TOP"
            };
            return labels[key] || "트렌드";
        }

        function formatCount(value) {
            const number = Number(value || 0);
            if (number >= 10000) return `${Math.round((number / 10000) * 10) / 10}만`;
            return number.toLocaleString("ko-KR");
        }

        function safeUrl(value) {
            try {
                const url = new URL(value);
                return ["http:", "https:"].includes(url.protocol) ? url.toString() : "";
            } catch {
                return "";
            }
        }

        function formatTime(date) {
            return new Intl.DateTimeFormat("ko-KR", {
                hour: "2-digit",
                minute: "2-digit"
            }).format(date);
        }

        function openArticle(item) {
            const target = safeUrl(item.link);
            if (target) window.location.href = target;
        }

        function openModal(item, rank) {
            document.getElementById("modalImg").src = safeUrl(item.img) || fallbackImages[activeTab] || defaultFallback;
            document.getElementById("modalTitle").textContent = item.title || "제목 없음";
            document.getElementById("modalContent").textContent = item.content || "원문 링크에서 상세 내용을 확인할 수 있습니다.";
            document.getElementById("modalMeta").textContent = `TOP ${rank} · ${sourceLabel(item)}`;
            document.getElementById("modalGoBtn").href = safeUrl(item.link) || "#";
            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        document.querySelectorAll(".tab-btn").forEach((button) => {
            button.addEventListener("click", () => {
                activeTab = button.dataset.category;
                document.querySelectorAll(".tab-btn").forEach((tab) => tab.classList.remove("active"));
                button.classList.add("active");
                paintCards();
            });
        });

        modal.addEventListener("click", (event) => {
            if (event.target === modal) closeModal();
        });

        document.getElementById("closeModalBtn").addEventListener("click", closeModal);
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeModal();
        });

        fetchSystem();
        setInterval(fetchSystem, syncIntervalMs);
    </script>
</body>
</html>
