<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 모아리뷰</title>
    <style>
        :root {
            --bg: #050608;
            --panel: #15171b;
            --panel-2: #1b1e24;
            --line: rgba(255, 255, 255, 0.08);
            --text: #f3f5f7;
            --muted: #a7adb7;
            --soft: #737b88;
            --accent: #ff3d68;
            --cyan: #36d7ff;
            --lime: #b7f36a;
            --nav: #20242a;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                linear-gradient(118deg, rgba(54, 215, 255, 0.24), transparent 24%),
                linear-gradient(72deg, transparent 18%, rgba(255, 61, 104, 0.28) 42%, transparent 68%),
                linear-gradient(165deg, transparent 8%, rgba(128, 87, 255, 0.24) 30%, transparent 52%),
                var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 26px 18px 34px;
            background:
                linear-gradient(180deg, transparent 0, rgba(5, 6, 8, 0.2) 230px, var(--bg) 390px),
                transparent;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 42px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.26);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.24);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0;
        }

        .sync-pill {
            color: rgba(255, 255, 255, 0.76);
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.28);
            border-radius: 999px;
            padding: 7px 10px;
            max-width: 210px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hero {
            text-align: center;
            padding: 38px 0 52px;
        }

        .hero-title {
            margin: 0;
            font-size: 44px;
            line-height: 1.08;
            font-weight: 900;
            letter-spacing: 0;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
        }

        .hero-sub {
            margin: 12px 0 0;
            color: rgba(255, 255, 255, 0.76);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.18em;
        }

        .hero-line {
            width: 54px;
            height: 5px;
            margin: 18px auto 0;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.52);
        }

        .tab-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 20px;
            margin: 0 -2px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tab-wrapper::-webkit-scrollbar {
            display: none;
        }

        .main-tab-wrapper {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin: 0 0 12px;
        }

        .main-tab-btn {
            min-height: 46px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(14, 16, 20, 0.72);
            color: rgba(255, 255, 255, 0.68);
            padding: 0 8px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0;
            cursor: pointer;
            white-space: nowrap;
        }

        .main-tab-btn.active {
            color: #fff;
            border-color: rgba(255, 61, 104, 0.7);
            background:
                linear-gradient(135deg, rgba(255, 61, 104, 0.34), rgba(54, 215, 255, 0.12)),
                rgba(255, 255, 255, 0.12);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 12px 24px rgba(255, 61, 104, 0.12);
        }

        .filter-tabs {
            padding-bottom: 18px;
        }

        .filter-tabs.hidden {
            display: none;
        }

        .tab-btn {
            flex: 0 0 auto;
            min-height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(14, 16, 20, 0.72);
            color: rgba(255, 255, 255, 0.78);
            padding: 0 16px;
            font-size: 13px;
            font-weight: 850;
            cursor: pointer;
        }

        .tab-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.36);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .favorite-toggle {
            width: 100%;
            min-height: 44px;
            margin: 0 0 14px;
            border: 1px solid rgba(255, 61, 104, 0.28);
            border-radius: 14px;
            background: rgba(255, 61, 104, 0.1);
            color: rgba(255, 255, 255, 0.86);
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }

        .favorite-toggle.active {
            color: #fff;
            border-color: rgba(255, 61, 104, 0.64);
            background:
                linear-gradient(135deg, rgba(255, 61, 104, 0.28), rgba(54, 215, 255, 0.08)),
                rgba(255, 255, 255, 0.1);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            margin: 0 2px 12px;
            font-size: 12px;
            font-weight: 800;
        }

        .top-picks {
            display: grid;
            gap: 8px;
            margin: 0 0 14px;
        }

        .top-picks.hidden {
            display: none;
        }

        .favorite-panel {
            margin-bottom: 14px;
        }

        .favorite-panel.hidden {
            display: none;
        }

        .top-picks-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.88);
            font-size: 12px;
            font-weight: 900;
            margin: 0 2px;
        }

        .top-pick-list {
            display: grid;
            gap: 8px;
        }

        .top-pick {
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr) 46px;
            gap: 10px;
            align-items: center;
            min-height: 58px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 12px;
            background: rgba(19, 22, 27, 0.9);
            color: var(--text);
            padding: 8px 10px;
            cursor: pointer;
        }

        .top-pick-rank {
            color: var(--accent);
            font-size: 13px;
            font-weight: 950;
        }

        .top-pick-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 850;
        }

        .top-pick-tag {
            justify-self: end;
            color: rgba(255, 255, 255, 0.68);
            font-size: 10px;
            font-weight: 900;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            padding: 4px 6px;
        }

        .missed-picks {
            margin-top: -4px;
        }

        .missed-picks .top-picks-title {
            color: rgba(255, 255, 255, 0.78);
        }

        .missed-picks .top-pick {
            border-color: rgba(54, 215, 255, 0.14);
            background:
                linear-gradient(135deg, rgba(54, 215, 255, 0.08), rgba(255, 61, 104, 0.05)),
                rgba(19, 22, 27, 0.88);
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .trend-card {
            width: 100%;
            min-height: 142px;
            background: rgba(21, 23, 27, 0.96);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 108px;
            gap: 15px;
            align-items: center;
            box-shadow: 0 20px 36px rgba(0, 0, 0, 0.34);
            cursor: pointer;
            position: relative;
            z-index: 0;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .trend-card.mediaTrend {
            border-color: rgba(54, 215, 255, 0.16);
        }

        .trend-card.naverCafe {
            border-color: rgba(183, 243, 106, 0.15);
        }

        .trend-card.community {
            border-color: rgba(255, 61, 104, 0.16);
        }

        .trend-card:active {
            transform: scale(0.99);
        }

        .card-copy {
            min-width: 0;
        }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #f2f4f7;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 12px;
        }

        .rank-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px rgba(255, 61, 104, 0.8);
            transform: translateY(-8px);
        }

        .card-title {
            margin: 0;
            color: var(--text);
            font-size: 16px;
            line-height: 1.45;
            font-weight: 820;
            overflow-wrap: anywhere;
            word-break: keep-all;
        }

        .card-desc {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
            font-weight: 800;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .reason-line {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.56);
            font-size: 11px;
            line-height: 1.35;
            font-weight: 800;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .badge-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            min-height: 24px;
        }

        .trend-badge {
            color: #fff;
            background: rgba(255, 61, 104, 0.18);
            border: 1px solid rgba(255, 61, 104, 0.42);
            border-radius: 999px;
            padding: 4px 7px;
            font-size: 10px;
            font-weight: 950;
        }

        .trend-badge.rising {
            color: #071014;
            background: linear-gradient(135deg, #36d7ff, #b7f36a);
            border-color: rgba(54, 215, 255, 0.72);
        }

        .trend-badge.new {
            color: #fff;
            background: rgba(54, 215, 255, 0.18);
            border-color: rgba(54, 215, 255, 0.5);
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.72);
            cursor: pointer;
            font-size: 13px;
            font-weight: 900;
        }

        .icon-btn.active {
            color: #fff;
            border-color: rgba(255, 61, 104, 0.62);
            background: rgba(255, 61, 104, 0.2);
        }

        .thumb-box {
            width: 108px;
            height: 108px;
            border-radius: 8px;
            overflow: hidden;
            background: #252932;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            isolation: isolate;
            z-index: 2;
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 7px;
            transition: opacity 0.18s ease, filter 0.18s ease;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            font-weight: 800;
            padding: 38px 0;
        }

        @media (min-width: 700px) {
            body {
                background-color: #111318;
            }

            .app-shell {
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
            }
        }

        @media (max-width: 380px) {
            .app-shell {
                padding-left: 14px;
                padding-right: 14px;
            }

            .trend-card {
                grid-template-columns: minmax(0, 1fr) 92px;
                gap: 14px;
                padding: 18px;
            }

            .thumb-box {
                width: 92px;
                height: 92px;
            }

            .card-title {
                font-size: 15px;
            }

            .card-desc {
                font-size: 12px;
            }

            .main-tab-btn {
                min-height: 42px;
                font-size: 11px;
                padding: 0 6px;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="top-bar">
            <div class="brand-mark" aria-hidden="true">M</div>
            <div id="syncStatus" class="sync-pill">다음 갱신 확인 중</div>
        </header>

        <section class="hero">
            <h1 class="hero-title">실시간<br>모아리뷰</h1>
            <div class="hero-line"></div>
            <p class="hero-sub">REALTIME TRENDS</p>
        </section>

        <nav class="main-tab-wrapper" aria-label="메인 카테고리">
            <button class="main-tab-btn active" data-section="mediaTrend">실시간 방송</button>
            <button class="main-tab-btn" data-section="naverCafe">카페 인기글</button>
            <button class="main-tab-btn" data-section="community">화제글 모음</button>
        </nav>

        <button id="favoriteToggle" class="favorite-toggle" type="button">찜 모아보기 0</button>
        <section id="favoritePanel" class="top-picks favorite-panel hidden" aria-label="찜 모아보기"></section>

        <nav id="feedFilterTabs" class="tab-wrapper filter-tabs" aria-label="세부 필터">
            <button id="tab-mediaHot" class="tab-btn active" data-feed="mediaHot">라이브HOT</button>
            <button id="tab-mediaReplay" class="tab-btn" data-feed="mediaReplay">다시보기</button>
            <button id="tab-mediaGame" class="tab-btn" data-feed="mediaGame">게임</button>
            <button id="tab-mediaTalk" class="tab-btn" data-feed="mediaTalk">토크방송</button>
            <button id="tab-mediaMusic" class="tab-btn" data-feed="mediaMusic">음악라디오</button>
        </nav>

        <section id="topPicks" class="top-picks hidden" aria-label="오늘의 TOP 3"></section>
        <section id="yesterdayPicks" class="top-picks missed-picks hidden" aria-label="어제 놓친 인기글"></section>

        <div class="summary-row">
            <span id="activeSummary">라이브HOT TOP 10</span>
            <span id="activeSource">치지직,SOOP,트위치,유튜브 전체 시청자수</span>
        </div>

        <section class="grid-container" id="cardGrid">
            <p class="empty-state">실시간 트렌드를 불러오는 중입니다.</p>
        </section>
    </main>

    <script type="module">
        const dbEndpoint = "https://chosanghee00001-default-rtdb.firebaseio.com/categories.json";
        const maxItems = 10;
        const yesterdayLimit = 5;
        const syncIntervalMs = 60 * 60 * 1000;
        const fallbackImages = {
            naverCafe: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80",
            community: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=80",
            mediaTrend: "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=900&q=80"
        };

        const sections = {
            mediaTrend: {
                label: "실시간 방송",
                source: "치지직,SOOP,트위치,유튜브 시청자수",
                empty: "미디어 트렌드 데이터 연결 준비 중입니다.",
                feeds: [
                    {
                        key: "mediaHot",
                        label: "라이브HOT",
                        dataKeys: ["mediaHot", "mediaTrends", "mediaChat", "mediaTrend", "media", "liveTrends"],
                        source: "치지직,SOOP,트위치,유튜브 전체 시청자수"
                    },
                    {
                        key: "mediaReplay",
                        label: "인기 다시보기",
                        dataKeys: ["mediaReplay"],
                        source: "치지직 다시보기 조회수"
                    },
                    {
                        key: "mediaGame",
                        label: "게임",
                        dataKeys: ["mediaGame"],
                        source: "치지직,SOOP,트위치,유튜브 게임 시청자수"
                    },
                    {
                        key: "mediaTalk",
                        label: "토크방송",
                        dataKeys: ["mediaTalk"],
                        source: "치지직,SOOP,트위치,유튜브 토크·소통 시청자수"
                    },
                    {
                        key: "mediaMusic",
                        label: "음악라디오",
                        dataKeys: ["mediaMusic"],
                        source: "치지직,SOOP,트위치,유튜브 음악·라디오 시청자수"
                    }
                ]
            },
            naverCafe: {
                label: "카페 인기글",
                source: "네이버카페·다음카페 통합 랭킹",
                empty: "카페 인기글 데이터가 비어있습니다.",
                feeds: [
                    { key: "daily", label: "실시간HOT", dataKeys: ["daily"], source: "네이버카페·다음카페 실시간 인기글" },
                    { key: "weekly", label: "주간TOP", dataKeys: ["weekly"], source: "네이버카페·다음카페 주간 TOP" },
                    { key: "cafeTravel", label: "여행후기", dataKeys: ["cafeTravel"], source: "네이버카페·다음카페 여행 후기 인기글" },
                    { key: "cafeFood", label: "맛집리뷰", dataKeys: ["cafeFood"], source: "네이버카페·다음카페 맛집 리뷰 인기글" },
                    { key: "cafeOutfit", label: "패션/코디", dataKeys: ["cafeOutfit"], source: "네이버카페·다음카페 오늘의 코디 인기글" }
                ]
            },
            community: {
                label: "화제글 모음",
                source: "디시·더쿠·루리웹·뽐뿌·인스티즈 통합 랭킹",
                empty: "커뮤니티 인기 데이터 연결 준비 중입니다.",
                feeds: [
                    {
                        key: "communityIssue",
                        label: "이슈",
                        dataKeys: ["communityIssue", "communityPopular", "community", "communities"],
                        source: "5개 커뮤니티 통합 이슈·사회 화제"
                    },
                    {
                        key: "communityHumor",
                        label: "유머",
                        dataKeys: ["communityHumor"],
                        source: "5개 커뮤니티 통합 유머·밈"
                    },
                    {
                        key: "communityEntertain",
                        label: "방송연예",
                        dataKeys: ["communityEntertain"],
                        source: "5개 커뮤니티 통합 방송·연예 화제"
                    },
                    {
                        key: "communityEvent",
                        label: "이벤트정보",
                        dataKeys: ["communityEvent"],
                        source: "5개 커뮤니티 통합 이벤트·혜택 정보"
                    }
                ]
            }
        };

        let activeSection = "mediaTrend";
        let activeFeedBySection = {
            mediaTrend: "mediaHot",
            naverCafe: "daily",
            community: "communityIssue"
        };
        let rawDataStore = {};
        const favoriteStorageKey = "moaReviewFavorites";
        const favoriteItemStorageKey = "moaReviewFavoriteItems";
        const yesterdayStorageKey = "moaReviewYesterdayPicks";
        const favoriteLinks = new Set(loadFavorites());
        const favoriteItems = new Map(loadFavoriteItems().map((item) => [safeUrl(item.link), item]));
        let favoritePanelOpen = false;

        const grid = document.getElementById("cardGrid");
        const syncStatus = document.getElementById("syncStatus");
        const activeSummary = document.getElementById("activeSummary");
        const activeSource = document.getElementById("activeSource");
        const feedFilterTabs = document.getElementById("feedFilterTabs");
        const topPicks = document.getElementById("topPicks");
        const yesterdayPicks = document.getElementById("yesterdayPicks");
        const favoriteToggle = document.getElementById("favoriteToggle");
        const favoritePanel = document.getElementById("favoritePanel");

        async function fetchSystem() {
            try {
                const url = `${dbEndpoint}?ts=${Date.now()}`;
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) throw new Error(`Firebase ${res.status}`);

                rawDataStore = await res.json() || {};
                syncStatus.textContent = buildNextSyncLabel(rawDataStore);
                syncLocalYesterdayHistory(rawDataStore);
                renderYesterdayPicks();
                renderFavoritePanel();
                renderFeedTabs();
                paintCards();
            } catch (err) {
                syncStatus.textContent = "다음 갱신 대기";
                showEmpty("실시간 트렌드를 동기화하는 데 대기 시간이 필요합니다.");
            }
        }

        function renderFeedTabs() {
            const section = getActiveSection();
            const feeds = section.feeds || [];
            feedFilterTabs.innerHTML = "";
            feedFilterTabs.classList.toggle("hidden", feeds.length <= 1);

            feeds.forEach((feed) => {
                const button = document.createElement("button");
                button.className = "tab-btn";
                button.dataset.feed = feed.key;
                button.textContent = feed.label;
                if (getActiveFeed().key === feed.key) button.classList.add("active");
                button.addEventListener("click", () => {
                    activeFeedBySection[activeSection] = feed.key;
                    renderFeedTabs();
                    paintCards();
                });
                feedFilterTabs.appendChild(button);
            });
        }

        function paintCards() {
            grid.innerHTML = "";
            const section = getActiveSection();
            const feed = getActiveFeed();
            const activeList = findDataList(feed.dataKeys).slice(0, maxItems);

            activeSummary.textContent = `${feed.label} ${activeList.length}/${maxItems}`;
            activeSource.textContent = feed.source || section.source;
            renderTopPicks(activeList, activeSection, feed);

            if (activeList.length === 0) {
                showEmpty(section.empty);
                return;
            }

            activeList.forEach((item, index) => {
                grid.appendChild(createCard(item, index, activeSection));
            });
        }

        function createCard(item, index, sectionKey) {
            const view = toCardView(item, index, sectionKey);
            const card = document.createElement("article");
            card.className = `trend-card ${sectionKey}`;
            card.setAttribute("role", "link");
            card.tabIndex = 0;
            card.addEventListener("click", () => openArticle(view.link));
            card.addEventListener("keydown", (event) => {
                if (event.target.closest("button")) return;
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openArticle(view.link);
                }
            });

            const copy = document.createElement("div");
            copy.className = "card-copy";

            const rankRow = document.createElement("div");
            rankRow.className = "rank-row";
            const rankText = document.createElement("span");
            rankText.textContent = String(view.rank).padStart(2, "0");
            const rankDot = document.createElement("span");
            rankDot.className = "rank-dot";
            rankRow.append(rankText, rankDot);

            const title = document.createElement("h2");
            title.className = "card-title";
            title.textContent = view.title;

            const desc = document.createElement("p");
            desc.className = "card-desc";
            desc.textContent = view.meta;

            const reason = document.createElement("p");
            reason.className = "reason-line";
            reason.textContent = view.reason;

            const badgeRow = document.createElement("div");

                const badge = document.createElement("span");
                badge.className = `trend-badge ${getBadgeTone(badgeText)}`;
                badge.textContent = badgeText;
                badgeRow.appendChild(badge);
            }

            const actions = document.createElement("div");
            actions.className = "card-actions";
            const favoriteButton = document.createElement("button");
            favoriteButton.type = "button";
            favoriteButton.className = `icon-btn${isFavorite(view.link) ? " active" : ""}`;
            favoriteButton.title = "찜하기";
            favoriteButton.setAttribute("aria-label", "찜하기");
            favoriteButton.textContent = "☆";
            if (isFavorite(view.link)) favoriteButton.textContent = "★";
            favoriteButton.addEventListener("click", (event) => {
                event.stopPropagation();
                toggleFavorite(view, favoriteButton);
            });

            const shareButton = document.createElement("button");
            shareButton.type = "button";
            shareButton.className = "icon-btn";
            shareButton.title = "공유하기";
            shareButton.setAttribute("aria-label", "공유하기");
            shareButton.textContent = "↗";
            shareButton.addEventListener("click", (event) => {
                event.stopPropagation();
                shareArticle(view);
            });

            actions.append(favoriteButton, shareButton);
            badgeRow.appendChild(actions);

            copy.append(rankRow, title, desc, reason, badgeRow);

            const thumbBox = document.createElement("div");
            thumbBox.className = "thumb-box";

            const img = document.createElement("img");
            img.referrerPolicy = "no-referrer";
            img.src = safeUrl(view.img) || fallbackImages[sectionKey] || fallbackImages.naverCafe;
            img.alt = view.title;
            img.loading = "lazy";
            img.onerror = () => {
                img.onerror = null;
                img.src = fallbackImages[sectionKey] || fallbackImages.naverCafe;
            };

            thumbBox.appendChild(img);

            card.append(copy, thumbBox);
            return card;
        }

        function toCardView(item, index, sectionKey) {
            const source = getItemSource(item, sectionKey);
            const baseTitle = firstText(item.title, item.subject, item.name, item.videoTitle, item.contentTitle, "제목 없음");
            const title = baseTitle;
            const link = firstText(item.link, item.url, item.articleUrl, item.watchUrl, item.contentUrl);
            const viewerCount = firstNumber(item.viewerCount, item.concurrentUserCount, item.currentViewCount);
            const viewCount = firstNumber(item.readCount, item.viewCount, item.views);
            const viewTime = firstText(item.viewTime, item.watchTime, item.duration, item.runtime, item.publishedLabel);
            const recommendCount = firstNumber(
                item.recommendCount,
                item.recommend,
                item.upCount,
                item.likeCount,
                item.likes
            );
            const commentCount = firstNumber(item.commentCount, item.comments, item.replyCount);

            return {
                rank: firstNumber(item.rank, item.naverRank) || index + 1,
                sectionKey,
                title,
                link,
                source,
                publishedAt: firstText(item.publishedAt, item.createdAt, item.openDate),
                viewerCount,
                viewCount,
                recommendCount,
                commentCount,
                rankDelta: firstNumber(item.rankDelta),
                isNewEntry: Boolean(item.isNewEntry),
                img: firstText(
                    item.img,
                    item.thumbnail,
                    item.thumbnailUrl,
                    item.image,
                    item.imageUrl,
                    item.videoThumbnail,
                    item.contentThumbnail,
                    item.poster,
                    item.posterUrl
                ),
                meta: buildMeta(sectionKey, {
                    source,
                    viewerCount,
                    viewCount,
                    viewTime,
                    recommendCount,
                    commentCount,
                    mediaCategory: firstText(item.mediaCategory, item.category)
                }),
                reason: buildReason(sectionKey, {
                    viewerCount,
                    viewCount,
                    recommendCount,
                    commentCount,
                    source,
                    rankDelta: firstNumber(item.rankDelta),
                    isNewEntry: Boolean(item.isNewEntry)
                }),
                badges: buildBadges({
                    rank: firstNumber(item.rank, item.naverRank) || index + 1,
                    publishedAt: firstText(item.publishedAt, item.createdAt, item.openDate),
                    rankDelta: firstNumber(item.rankDelta),
                    isNewEntry: Boolean(item.isNewEntry)
                })
            };
        }

        function renderFavoritePanel() {
            hydrateFavoriteItemsFromCurrentData();
            updateFavoriteToggle();

            favoriteToggle.classList.toggle("active", favoritePanelOpen);
            favoritePanel.classList.toggle("hidden", !favoritePanelOpen);
            if (!favoritePanelOpen) return;

                .filter((item) => favoriteLinks.has(safeUrl(item.link)))
                .sort((a, b) => firstNumber(b.savedAt) - firstNumber(a.savedAt));

            title.className = "top-picks-title";

            right.textContent = `${items.length}개`;

                tag.textContent = firstText(item.feedLabel, sections[sectionKey]?.label, "찜");

        function getYesterdayHistory() {
            const serverItems = rawDataStore?._history?.yesterdayPicks;
            if (Array.isArray(serverItems) && serverItems.length > 0) {
                return {
                    dateKey: firstText(rawDataStore?._history?.yesterdayDateKst),
                    items: serverItems
                };
            }

            try {
                const saved = JSON.parse(localStorage.getItem(yesterdayStorageKey) || "{}");
                const items = Array.isArray(saved.yesterdayPicks) ? saved.yesterdayPicks : [];
                return {
                    dateKey: firstText(saved.yesterdayDateKey),
                    items
                };
            } catch {
                return { dateKey: "", items: [] };
            }
        }

        function syncLocalYesterdayHistory(store) {
            const todayKey = getStoreDateKey(store) || formatKstDateKey(new Date());
            const todayPicks = buildSnapshotPicks(store);
            if (!todayKey || todayPicks.length === 0) return;

            try {
                const saved = JSON.parse(localStorage.getItem(yesterdayStorageKey) || "{}");
                const next = {
                    dateKey: todayKey,
                    todayPicks,
                    yesterdayDateKey: firstText(saved.yesterdayDateKey),
                    yesterdayPicks: Array.isArray(saved.yesterdayPicks) ? saved.yesterdayPicks : []
                };

                if (saved.dateKey && saved.dateKey !== todayKey && Array.isArray(saved.todayPicks) && saved.todayPicks.length > 0) {
                    next.yesterdayDateKey = saved.dateKey;
                    next.yesterdayPicks = saved.todayPicks;
                }

                localStorage.setItem(yesterdayStorageKey, JSON.stringify(next));
            } catch {
                // Storage can be unavailable in private browser modes.
            }
        }

        function buildSnapshotPicks(store) {
            const sources = [
                { key: "mediaHot", sectionKey: "mediaTrend", feedLabel: "실시간 방송", max: 4 },
                { key: "daily", sectionKey: "naverCafe", feedLabel: "카페 인기글", max: 4 },
                { key: "communityPopular", sectionKey: "community", feedLabel: "화제글 모음", max: 4 }
            ];
            const lists = sources.map((source) =>
                normalizeList(store?.[source.key]).slice(0, source.max).map((item) => toSnapshotPick(item, source))
            );
            const merged = [];
            const maxLength = Math.max(...lists.map((items) => items.length), 0);

            for (let index = 0; index < maxLength; index += 1) {
                for (const list of lists) {
                    if (list[index]) merged.push(list[index]);
                    if (merged.length >= maxItems) break;
                }
                if (merged.length >= maxItems) break;
            }

            return dedupeSnapshotPicks(merged).slice(0, maxItems);
        }

        function toSnapshotPick(item, source) {
            const image = compactSnapshotImage(
                firstText(item.img, item.thumbnail, item.thumbnailUrl, item.image, item.videoThumbnail, item.contentThumbnail),
                fallbackImages[source.sectionKey] || fallbackImages.naverCafe
            );

            return {
                rank: firstNumber(item.rank, item.naverRank),
                title: firstText(item.title, item.subject, item.name, item.videoTitle, "제목 없음"),
                link: firstText(item.link, item.url, item.articleUrl, item.watchUrl, item.contentUrl),
                img: image,
                thumbnail: image,
                source: firstText(item.source, item.siteName, item.cafeName, item.communityName, item.platformName, source.feedLabel),
                siteName: firstText(item.siteName, item.source, source.feedLabel),
                boardName: firstText(item.boardName, item.channelName, source.feedLabel),
                cafeName: firstText(item.cafeName, item.source),
                communityName: firstText(item.communityName, item.source),
                platformName: firstText(item.platformName, item.source),
                channelName: firstText(item.channelName, item.boardName),
                sectionKey: source.sectionKey,
                feedKey: source.key,
                feedLabel: source.feedLabel,
                viewCount: firstNumber(item.viewCount, item.readCount, item.views),
                readCount: firstNumber(item.readCount, item.viewCount),
                viewerCount: firstNumber(item.viewerCount, item.concurrentUserCount),
                concurrentUserCount: firstNumber(item.concurrentUserCount, item.viewerCount),
                recommendCount: firstNumber(item.recommendCount, item.likeCount, item.likes),
                commentCount: firstNumber(item.commentCount, item.comments, item.replyCount),
                publishedAt: firstText(item.publishedAt, item.createdAt, item.openDate),
                mediaCategory: firstText(item.mediaCategory, item.category),
                communityCategory: firstText(item.communityCategory)
            };
        }

        function dedupeSnapshotPicks(items) {
            const seen = new Set();
            return items.filter((item) => {
                const key = safeUrl(item.link) || normalizeDedupeText(item.title);
                if (!key || seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function compactSnapshotImage(value, fallbackImage) {
            const image = String(value || "").trim();
            if (!image) return fallbackImage;
            if (image.startsWith("data:image/") && image.length > 120000) return fallbackImage;
            return image;
        }

        function buildReason(sectionKey, values) {
            if (values.rankDelta >= 2) {
                return `지난 갱신보다 ${values.rankDelta}계단 올라 급상승 중이에요.`;
            }

            if (values.isNewEntry) {
                return "지난 갱신에는 없던 새 인기글이에요.";
            }

            if (sectionKey === "mediaTrend") {
                if (values.viewerCount > 0) return `실시간 시청자 ${formatCount(values.viewerCount)}명 기준으로 상위권이에요.`;
                if (values.viewCount > 0) return `다시보기 조회 ${formatCount(values.viewCount)}회로 반응이 높아요.`;
                return "방송 플랫폼 인기 목록에서 잡힌 콘텐츠예요.";
            }

            if (sectionKey === "naverCafe") {
                if (values.viewCount > 0 && values.commentCount > 0) {
                    return `조회 ${formatCount(values.viewCount)}회와 댓글 ${formatCount(values.commentCount)}개로 반응이 커요.`;
                }
                if (values.recommendCount > 0) return `좋아요 ${formatCount(values.recommendCount)}개로 카페 반응이 좋아요.`;
                return "네이버·다음 카페 인기 목록에서 올라온 글이에요.";
            }

            if (values.commentCount > 0 && values.recommendCount > 0) {
                return `추천 ${formatCount(values.recommendCount)}개, 댓글 ${formatCount(values.commentCount)}개로 화제성이 높아요.`;
            }
            if (values.viewCount > 0) return `조회 ${formatCount(values.viewCount)}회로 커뮤니티에서 많이 본 글이에요.`;
            return `${values.source || "커뮤니티"} 인기 목록에서 잡힌 글이에요.`;
        }

        function buildBadges({ rank, publishedAt, rankDelta, isNewEntry }) {
            const badges = [];
            if (rankDelta >= 2) badges.push(`▲ ${rankDelta}`);
            if (rank <= 3) badges.push("HOT");
            const age = ageInHours(publishedAt);
            if (isNewEntry || (age >= 0 && age <= 6)) badges.push("NEW");
            return badges.slice(0, 2);
        }

        function getBadgeTone(text) {
            if (String(text || "").startsWith("▲")) return "rising";
            if (String(text || "").toUpperCase() === "NEW") return "new";
            return "";
        }

        function toggleFavorite(view, button) {
            const target = safeUrl(view?.link);
            if (!target) return;

            if (favoriteLinks.has(target)) {
                favoriteLinks.delete(target);
                favoriteItems.delete(target);
                button.classList.remove("active");
                button.textContent = "☆";
            } else {
                favoriteLinks.add(target);
                favoriteItems.set(target, toFavoriteSnapshot(view));
                button.classList.add("active");
                button.textContent = "★";
            }

            saveFavorites();
            renderFavoritePanel();
        }

        function loadFavorites() {
            try {
                const values = JSON.parse(localStorage.getItem(favoriteStorageKey) || "[]");
                return Array.isArray(values) ? values.filter(Boolean) : [];
            } catch {
                return [];
            }
        }

        function loadFavoriteItems() {
            try {
                const values = JSON.parse(localStorage.getItem(favoriteItemStorageKey) || "[]");
                return Array.isArray(values) ? values.filter((item) => safeUrl(item?.link)) : [];
            } catch {
                return [];
            }
        }

        function saveFavorites() {
            try {
                localStorage.setItem(favoriteStorageKey, JSON.stringify([...favoriteLinks]));
                localStorage.setItem(favoriteItemStorageKey, JSON.stringify([...favoriteItems.values()]));
            } catch {
                // Storage can be unavailable in private browser modes.
            }
            updateFavoriteToggle();
        }

        function updateFavoriteToggle() {
            favoriteToggle.textContent = `찜 모아보기 ${favoriteLinks.size}`;
        }

        function toFavoriteSnapshot(view) {
            return {
                rank: view.rank,
                title: view.title,
                link: view.link,
                img: compactSnapshotImage(view.img, fallbackImages[view.sectionKey] || fallbackImages.naverCafe),
                thumbnail: compactSnapshotImage(view.img, fallbackImages[view.sectionKey] || fallbackImages.naverCafe),
                source: firstText(view.source, sections[view.sectionKey]?.label),
                siteName: firstText(view.source, sections[view.sectionKey]?.label),
                sectionKey: view.sectionKey,
                feedLabel: sections[view.sectionKey]?.label || "찜",
                viewCount: view.viewCount,
                viewerCount: view.viewerCount,
                recommendCount: view.recommendCount,
                commentCount: view.commentCount,
                publishedAt: view.publishedAt,
                rankDelta: view.rankDelta,
                isNewEntry: view.isNewEntry,
                savedAt: Date.now()
            };
        }

        function hydrateFavoriteItemsFromCurrentData() {
            for (const link of favoriteLinks) {
                const target = safeUrl(link);
                if (!target || favoriteItems.has(target)) continue;

                const match = findCurrentItemByLink(target);
                if (match) {
                    const view = toCardView(match.item, 0, match.sectionKey);
                    favoriteItems.set(target, toFavoriteSnapshot(view));
                } else {
                    favoriteItems.set(target, {
                        title: target,
                        link: target,
                        img: fallbackImages.mediaTrend,
                        sectionKey: "mediaTrend",
                        feedLabel: "찜",
                        savedAt: 0
                    });
                }
            }
        }

        function findCurrentItemByLink(target) {
            for (const [key, value] of Object.entries(rawDataStore || {})) {
                if (!Array.isArray(value)) continue;
                const item = value.find((entry) => {
                    const link = firstText(entry?.link, entry?.url, entry?.articleUrl, entry?.watchUrl, entry?.contentUrl);
                    return safeUrl(link) === target;
                });
                if (item) return { item, sectionKey: inferSectionFromFeedKey(key) };
            }
            return null;
        }

        function inferSectionFromFeedKey(key) {
            for (const [sectionKey, section] of Object.entries(sections)) {
                const feeds = section.feeds || [];
                if (feeds.some((feed) => feed.key === key || (feed.dataKeys || []).includes(key))) {
                    return sectionKey;
                }
            }
            return "mediaTrend";
        }

        function isFavorite(link) {
            const target = safeUrl(link);
            return target ? favoriteLinks.has(target) : false;
        }

        async function shareArticle(view) {
            const target = safeUrl(view.link);
            if (!target) return;

            if (navigator.share) {
                await navigator.share({ title: view.title, url: target }).catch(() => {});
                return;
            }

            await navigator.clipboard?.writeText(target).catch(() => {});
            syncStatus.textContent = "링크 복사됨";
            window.setTimeout(() => {
                syncStatus.textContent = buildNextSyncLabel(rawDataStore);
            }, 1400);
        }

        function buildMeta(sectionKey, values) {
            const parts = [];
            if (sectionKey === "mediaTrend") {
                const isReplay = values.mediaCategory === "replay" || /다시보기|VOD/i.test(values.viewTime || "");
                if (!isReplay && values.viewerCount > 0) {
                    parts.push(`시청자 ${formatCount(values.viewerCount)}`);
                } else if (values.viewCount > 0) {
                    parts.push(`조회 ${formatCount(values.viewCount)}`);
                } else if (values.viewTime) {
                    parts.push(values.viewTime);
                }
            } else if (values.viewCount > 0) {
                parts.push(`조회 ${formatCount(values.viewCount)}`);
            }

            if (sectionKey === "naverCafe") {
                if (values.recommendCount > 0) parts.push(`좋아요 ${formatCount(values.recommendCount)}`);
            } else {
                if (values.recommendCount > 0) parts.push(`추천 ${formatCount(values.recommendCount)}`);
            }

            if (values.commentCount > 0) parts.push(`댓글 ${formatCount(values.commentCount)}`);
            if (values.source) parts.push(values.source);
            return parts.join(" · ");
        }

        function getItemSource(item, sectionKey) {
            if (sectionKey === "naverCafe") {
                return firstText(item.cafeName, item.source, sections[sectionKey].label);
            }

            if (sectionKey === "mediaTrend") {
                const platform = firstText(item.platformName, item.source, item.siteName);
                const channel = firstText(item.channelName, item.boardName);
                if (platform && channel && platform !== channel) return `${platform} · ${channel}`;
                return firstText(platform, channel, sections[sectionKey].label);
            }

            return firstText(item.communityName, item.source, item.siteName, item.boardName, sections[sectionKey].label);
        }

        function findDataList(keys) {
            for (const key of keys || []) {
                const list = normalizeList(rawDataStore[key]);
                if (list.length > 0) return list;
            }
            return [];
        }

        function normalizeList(value) {
            const list = Array.isArray(value) ? value : Object.values(value || {});
            return list
                .filter(Boolean)
                .sort((a, b) => firstNumber(a.rank, a.naverRank, 999) - firstNumber(b.rank, b.naverRank, 999));
        }

        function showEmpty(message) {
            grid.innerHTML = "";
            const empty = document.createElement("p");
            empty.className = "empty-state";
            empty.textContent = message;
            grid.appendChild(empty);
        }

        function getActiveSection() {
            return sections[activeSection] || sections.mediaTrend;
        }

        function getActiveFeed() {
            const section = getActiveSection();
            const feedKey = activeFeedBySection[activeSection];
            return section.feeds.find((feed) => feed.key === feedKey) || section.feeds[0];
        }

        function setActiveSection(sectionKey) {
            activeSection = sectionKey;
            document.querySelectorAll(".main-tab-btn").forEach((button) => {
                button.classList.toggle("active", button.dataset.section === sectionKey);
            });
            renderFeedTabs();
            paintCards();
        }

        function firstText(...values) {
            return values.find((value) => String(value || "").trim()) || "";
        }

        function firstNumber(...values) {
            for (const value of values) {
                const number = Number(value);
                if (Number.isFinite(number) && number > 0) return number;
            }
            return 0;
        }

        function formatCount(value) {
            const number = Number(value || 0);
            if (number >= 10000) return `${Math.round((number / 10000) * 10) / 10}만`;
            return number.toLocaleString("ko-KR");
        }

        function safeUrl(value) {
            const raw = String(value || "").trim();
            if (/^data:image\/(?:png|jpe?g|gif|webp);base64,[a-z0-9+/]+=*$/i.test(raw)) {
                return raw;
            }

            try {
                const url = new URL(raw);
                return ["http:", "https:"].includes(url.protocol) ? url.toString() : "";
            } catch {
                return "";
            }
        }

        function normalizeDedupeText(value) {
            return String(value || "")
                .toLowerCase()
                .replace(/\s+/g, "")
                .slice(0, 80);
        }

        function formatTime(date) {
            return new Intl.DateTimeFormat("ko-KR", {
                timeZone: "Asia/Seoul",
                hour: "2-digit",
                minute: "2-digit"
            }).format(date);
        }

        function formatKstDateKey(date) {
            return new Intl.DateTimeFormat("sv-SE", {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }).format(date);
        }

        function getStoreDateKey(store) {
            const updatedAtKst = firstText(store?._meta?.updatedAtKst);
            if (/^\d{4}-\d{2}-\d{2}/.test(updatedAtKst)) return updatedAtKst.slice(0, 10);

            const updatedAt = firstText(store?._meta?.updatedAt, store?.updatedAt);
            const date = new Date(updatedAt || "");
            if (Number.isNaN(date.getTime())) return "";
            return formatKstDateKey(date);
        }

        function buildNextSyncLabel(store) {
            const intervalMinutes = firstNumber(store?._meta?.updateIntervalMinutes, 60);
            const intervalMs = intervalMinutes * 60 * 1000;
            const updatedAt = firstText(store?._meta?.updatedAt, store?.updatedAt);
            const updatedAtKst = firstText(store?._meta?.updatedAtKst);
            let lastUpdated = new Date(updatedAt || "");

            if (Number.isNaN(lastUpdated.getTime()) && updatedAtKst) {
                lastUpdated = new Date(`${updatedAtKst.replace(" ", "T")}+09:00`);
            }

            if (!Number.isNaN(lastUpdated.getTime()) && intervalMs > 0) {
                let nextTime = lastUpdated.getTime() + intervalMs;
                const now = Date.now();
                while (nextTime <= now) nextTime += intervalMs;
                return `다음 갱신 ${formatTime(new Date(nextTime))}`;
            }

            return "다음 갱신 대기";
        }

        function ageInHours(value) {
            const date = new Date(value || "");
            if (Number.isNaN(date.getTime())) return -1;
            return (Date.now() - date.getTime()) / (60 * 60 * 1000);
        }

        function openArticle(link) {
            const target = safeUrl(link);
            if (target) window.location.href = target;
        }

        document.querySelectorAll(".main-tab-btn").forEach((button) => {
            button.addEventListener("click", () => setActiveSection(button.dataset.section));
        });

        favoriteToggle.addEventListener("click", () => {
            favoritePanelOpen = !favoritePanelOpen;
            renderFavoritePanel();
        });

        renderFavoritePanel();
        renderFeedTabs();
        fetchSystem();
        setInterval(fetchSystem, syncIntervalMs);
    </script>
</body>
</html>
