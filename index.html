<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 모아리뷰</title>
    <style>
        :root {
            --bg: #050608;
            --panel: #15171b;
            --panel-2: #1b1e24;
            --line: rgba(255, 255, 255, 0.08);
            --text: #f3f5f7;
            --muted: #a7adb7;
            --soft: #737b88;
            --accent: #ff3d68;
            --cyan: #36d7ff;
            --lime: #b7f36a;
            --nav: #20242a;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                linear-gradient(118deg, rgba(54, 215, 255, 0.24), transparent 24%),
                linear-gradient(72deg, transparent 18%, rgba(255, 61, 104, 0.28) 42%, transparent 68%),
                linear-gradient(165deg, transparent 8%, rgba(128, 87, 255, 0.24) 30%, transparent 52%),
                var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 26px 18px 34px;
            background:
                linear-gradient(180deg, transparent 0, rgba(5, 6, 8, 0.2) 230px, var(--bg) 390px),
                transparent;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 42px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.26);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.24);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0;
        }

        .sync-pill {
            color: rgba(255, 255, 255, 0.76);
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.28);
            border-radius: 999px;
            padding: 7px 10px;
            max-width: 210px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hero {
            text-align: center;
            padding: 38px 0 52px;
        }

        .hero-title {
            margin: 0;
            font-size: 44px;
            line-height: 1.08;
            font-weight: 900;
            letter-spacing: 0;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
        }

        .hero-sub {
            margin: 12px 0 0;
            color: rgba(255, 255, 255, 0.76);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.18em;
        }

        .hero-line {
            width: 54px;
            height: 5px;
            margin: 18px auto 0;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.52);
        }

        .tab-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 20px;
            margin: 0 -2px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tab-wrapper::-webkit-scrollbar {
            display: none;
        }

        .main-tab-wrapper {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin: 0 0 12px;
        }

        .main-tab-btn {
            min-height: 46px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(14, 16, 20, 0.72);
            color: rgba(255, 255, 255, 0.68);
            padding: 0 8px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0;
            cursor: pointer;
            white-space: nowrap;
        }

        .main-tab-btn.active {
            color: #fff;
            border-color: rgba(255, 61, 104, 0.7);
            background:
                linear-gradient(135deg, rgba(255, 61, 104, 0.34), rgba(54, 215, 255, 0.12)),
                rgba(255, 255, 255, 0.12);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 12px 24px rgba(255, 61, 104, 0.12);
        }

        .filter-tabs {
            padding-bottom: 18px;
        }

        .filter-tabs.hidden {
            display: none;
        }

        .tab-btn {
            flex: 0 0 auto;
            min-height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(14, 16, 20, 0.72);
            color: rgba(255, 255, 255, 0.78);
            padding: 0 16px;
            font-size: 13px;
            font-weight: 850;
            cursor: pointer;
        }

        .tab-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.36);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            margin: 0 2px 12px;
            font-size: 12px;
            font-weight: 800;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .trend-card {
            width: 100%;
            min-height: 142px;
            background: rgba(21, 23, 27, 0.96);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 108px;
            gap: 15px;
            align-items: center;
            box-shadow: 0 20px 36px rgba(0, 0, 0, 0.34);
            cursor: pointer;
            position: relative;
            z-index: 0;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .trend-card.is-previewing {
            z-index: 20;
            border-color: rgba(255, 61, 104, 0.54);
            box-shadow: 0 24px 46px rgba(0, 0, 0, 0.52), 0 0 0 1px rgba(255, 61, 104, 0.18);
        }

        .trend-card:active {
            transform: scale(0.99);
        }

        .card-copy {
            min-width: 0;
        }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #f2f4f7;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 12px;
        }

        .rank-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px rgba(255, 61, 104, 0.8);
            transform: translateY(-8px);
        }

        .card-title {
            margin: 0;
            color: var(--text);
            font-size: 16px;
            line-height: 1.45;
            font-weight: 820;
            overflow-wrap: anywhere;
            word-break: keep-all;
        }

        .card-desc {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
            font-weight: 800;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .thumb-box {
            width: 108px;
            height: 108px;
            border-radius: 8px;
            overflow: visible;
            background: #252932;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            isolation: isolate;
            z-index: 2;
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 7px;
            transition: opacity 0.18s ease, transform 0.18s ease, filter 0.18s ease;
        }

        .media-preview {
            position: absolute;
            right: 0;
            top: 0;
            width: min(340px, calc(100vw - 44px));
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 14px;
            background: #050609;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.68);
            transform-origin: right top;
            transition: opacity 0.2s ease, transform 0.22s ease;
            z-index: 10;
            box-shadow: 0 22px 54px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.16);
        }

        .thumb-box .media-preview {
            width: min(340px, calc(100vw - 44px));
            height: auto;
        }

        .media-preview-image {
            display: block;
            object-fit: cover;
        }

        .thumb-box.is-previewing img {
            opacity: 0.3;
            transform: scale(0.94);
            filter: brightness(0.58) blur(1px);
        }

        .thumb-box.is-previewing .media-preview {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        @media (max-width: 480px) {
            .media-preview,
            .thumb-box .media-preview {
                width: min(320px, calc(100vw - 30px));
                right: -2px;
            }
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            font-weight: 800;
            padding: 38px 0;
        }

        @media (min-width: 700px) {
            body {
                background-color: #111318;
            }

            .app-shell {
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
            }
        }

        @media (max-width: 380px) {
            .app-shell {
                padding-left: 14px;
                padding-right: 14px;
            }

            .trend-card {
                grid-template-columns: minmax(0, 1fr) 92px;
                gap: 14px;
                padding: 18px;
            }

            .thumb-box {
                width: 92px;
                height: 92px;
            }

            .card-title {
                font-size: 15px;
            }

            .card-desc {
                font-size: 12px;
            }

            .main-tab-btn {
                min-height: 42px;
                font-size: 11px;
                padding: 0 6px;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="top-bar">
            <div class="brand-mark" aria-hidden="true">M</div>
            <div id="syncStatus" class="sync-pill">동기화 중</div>
        </header>

        <section class="hero">
            <h1 class="hero-title">실시간<br>모아리뷰</h1>
            <div class="hero-line"></div>
            <p class="hero-sub">REALTIME TRENDS</p>
        </section>

        <nav class="main-tab-wrapper" aria-label="메인 카테고리">
            <button class="main-tab-btn active" data-section="mediaTrend">미디어 트렌드</button>
            <button class="main-tab-btn" data-section="naverCafe">카페 인기글</button>
            <button class="main-tab-btn" data-section="community">커뮤니티 인기</button>
        </nav>

        <nav id="feedFilterTabs" class="tab-wrapper filter-tabs" aria-label="세부 필터">
            <button id="tab-daily" class="tab-btn active" data-feed="daily">실시간HOT</button>
            <button id="tab-weekly" class="tab-btn" data-feed="weekly">주간TOP</button>
        </nav>

        <div class="summary-row">
            <span id="activeSummary">실시간HOT TOP 10</span>
            <span id="activeSource">치지직,SOOP,트위치,유튜브 시청자수</span>
        </div>

        <section class="grid-container" id="cardGrid">
            <p class="empty-state">실시간 트렌드를 불러오는 중입니다.</p>
        </section>
    </main>

    <script type="module">
        const dbEndpoint = "https://chosanghee00001-default-rtdb.firebaseio.com/categories.json";
        const maxItems = 10;
        const syncIntervalMs = 60 * 60 * 1000;
        const fallbackImages = {
            naverCafe: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80",
            community: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=80",
            mediaTrend: "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=900&q=80"
        };

        const sections = {
            mediaTrend: {
                label: "미디어 트렌드",
                source: "치지직,SOOP,트위치,유튜브 시청자수",
                empty: "미디어 트렌드 데이터 연결 준비 중입니다.",
                feeds: [
                    {
                        key: "mediaChat",
                        label: "채팅",
                        dataKeys: ["mediaChat", "mediaTrends", "mediaTrend", "media", "liveTrends"],
                        source: "치지직,SOOP,트위치,유튜브 채팅 시청자수"
                    },
                    {
                        key: "mediaGame",
                        label: "게임",
                        dataKeys: ["mediaGame"],
                        source: "치지직,SOOP,트위치,유튜브 게임 시청자수"
                    },
                    {
                        key: "mediaMusic",
                        label: "음악",
                        dataKeys: ["mediaMusic"],
                        source: "치지직,SOOP,트위치,유튜브 음악 시청자수"
                    }
                ]
            },
            naverCafe: {
                label: "카페 인기글",
                source: "네이버카페·다음카페 통합 랭킹",
                empty: "카페 인기글 데이터가 비어있습니다.",
                feeds: [
                    { key: "daily", label: "실시간HOT", dataKeys: ["daily"], source: "네이버카페·다음카페 실시간 인기글" },
                    { key: "weekly", label: "주간TOP", dataKeys: ["weekly"], source: "네이버 카페 주간TOP" }
                ]
            },
            community: {
                label: "커뮤니티 인기",
                source: "디시인사이드 실베",
                empty: "디시인사이드 인기 데이터 연결 준비 중입니다.",
                feeds: [
                    {
                        key: "communityPopular",
                        label: "커뮤니티 인기",
                        dataKeys: ["communityPopular", "community", "communities"],
                        source: "디시인사이드 실베"
                    }
                ]
            }
        };

        let activeSection = "mediaTrend";
        let activeFeedBySection = {
            mediaTrend: "mediaChat",
            naverCafe: "daily",
            community: "communityPopular"
        };
        let rawDataStore = {};

        const grid = document.getElementById("cardGrid");
        const syncStatus = document.getElementById("syncStatus");
        const activeSummary = document.getElementById("activeSummary");
        const activeSource = document.getElementById("activeSource");
        const feedFilterTabs = document.getElementById("feedFilterTabs");

        async function fetchSystem() {
            try {
                const url = `${dbEndpoint}?ts=${Date.now()}`;
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) throw new Error(`Firebase ${res.status}`);

                rawDataStore = await res.json() || {};
                syncStatus.textContent = `${formatTime(new Date())} 갱신`;
                renderFeedTabs();
                paintCards();
            } catch (err) {
                syncStatus.textContent = "동기화 대기";
                showEmpty("실시간 트렌드를 동기화하는 데 대기 시간이 필요합니다.");
            }
        }

        function renderFeedTabs() {
            const section = getActiveSection();
            const feeds = section.feeds || [];
            feedFilterTabs.innerHTML = "";
            feedFilterTabs.classList.toggle("hidden", feeds.length <= 1);

            feeds.forEach((feed) => {
                const button = document.createElement("button");
                button.className = "tab-btn";
                button.dataset.feed = feed.key;
                button.textContent = feed.label;
                if (getActiveFeed().key === feed.key) button.classList.add("active");
                button.addEventListener("click", () => {
                    activeFeedBySection[activeSection] = feed.key;
                    renderFeedTabs();
                    paintCards();
                });
                feedFilterTabs.appendChild(button);
            });
        }

        function paintCards() {
            grid.innerHTML = "";
            const section = getActiveSection();
            const feed = getActiveFeed();
            const activeList = findDataList(feed.dataKeys).slice(0, maxItems);

            activeSummary.textContent = `${feed.label} ${activeList.length}/${maxItems}`;
            activeSource.textContent = feed.source || section.source;

            if (activeList.length === 0) {
                showEmpty(section.empty);
                return;
            }

            activeList.forEach((item, index) => {
                grid.appendChild(createCard(item, index, activeSection));
            });
        }

        function createCard(item, index, sectionKey) {
            const view = toCardView(item, index, sectionKey);
            const card = document.createElement("article");
            card.className = "trend-card";
            card.setAttribute("role", "link");
            card.tabIndex = 0;
            card.addEventListener("click", () => openArticle(view.link));
            card.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openArticle(view.link);
                }
            });

            const copy = document.createElement("div");
            copy.className = "card-copy";

            const rankRow = document.createElement("div");
            rankRow.className = "rank-row";
            const rankText = document.createElement("span");
            rankText.textContent = String(view.rank).padStart(2, "0");
            const rankDot = document.createElement("span");
            rankDot.className = "rank-dot";
            rankRow.append(rankText, rankDot);

            const title = document.createElement("h2");
            title.className = "card-title";
            title.textContent = view.title;

            const desc = document.createElement("p");
            desc.className = "card-desc";
            desc.textContent = view.meta;

            copy.append(rankRow, title, desc);

            const thumbBox = document.createElement("div");
            thumbBox.className = "thumb-box";

            const img = document.createElement("img");
            img.referrerPolicy = "no-referrer";
            img.src = safeUrl(view.img) || fallbackImages[sectionKey] || fallbackImages.naverCafe;
            img.alt = view.title;
            img.loading = "lazy";
            img.onerror = () => {
                img.onerror = null;
                img.src = fallbackImages[sectionKey] || fallbackImages.naverCafe;
            };

            thumbBox.appendChild(img);

            if (sectionKey === "mediaTrend" && (view.previewUrl || view.img)) {
                attachMediaPreview(card, thumbBox, view);
            }

            card.append(copy, thumbBox);
            return card;
        }

        function toCardView(item, index, sectionKey) {
            const source = getItemSource(item, sectionKey);
            const baseTitle = firstText(item.title, item.subject, item.name, item.videoTitle, item.contentTitle, "제목 없음");
            const title = baseTitle;
            const link = firstText(item.link, item.url, item.articleUrl, item.watchUrl, item.contentUrl);
            const viewerCount = firstNumber(item.viewerCount, item.concurrentUserCount, item.currentViewCount);
            const viewCount = firstNumber(item.readCount, item.viewCount, item.views);
            const viewTime = firstText(item.viewTime, item.watchTime, item.duration, item.runtime, item.publishedLabel);
            const recommendCount = firstNumber(
                item.recommendCount,
                item.recommend,
                item.upCount,
                item.likeCount,
                item.likes
            );
            const commentCount = firstNumber(item.commentCount, item.comments, item.replyCount);

            return {
                rank: firstNumber(item.rank, item.naverRank) || index + 1,
                title,
                link,
                previewUrl: getMediaPreviewUrl(item, link, sectionKey),
                previewType: getMediaPreviewType(item, sectionKey),
                img: firstText(
                    item.img,
                    item.thumbnail,
                    item.thumbnailUrl,
                    item.image,
                    item.imageUrl,
                    item.videoThumbnail,
                    item.contentThumbnail,
                    item.poster,
                    item.posterUrl
                ),
                meta: buildMeta(sectionKey, { source, viewerCount, viewCount, viewTime, recommendCount, commentCount })
            };
        }

        function attachMediaPreview(card, thumbBox, view) {
            const useIframe = view.previewType === "iframe" && view.previewUrl;
            const preview = document.createElement(useIframe ? "iframe" : "img");
            preview.className = "media-preview";
            preview.title = `${view.title} 미리보기`;
            if (useIframe) {
                preview.loading = "lazy";
                preview.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
                preview.referrerPolicy = "strict-origin-when-cross-origin";
                preview.dataset.src = withPreviewAutoplay(view.previewUrl);
                thumbBox.dataset.previewKind = "iframe";
            } else {
                preview.classList.add("media-preview-image");
                preview.referrerPolicy = "no-referrer";
                preview.alt = view.title;
                preview.src = safeUrl(view.img) || fallbackImages.mediaTrend;
                thumbBox.dataset.previewKind = "image";
            }
            thumbBox.classList.add("has-preview");
            thumbBox.appendChild(preview);

            let clearTimer = 0;
            const showPreview = () => {
                window.clearTimeout(clearTimer);
                if (useIframe && !preview.src) preview.src = preview.dataset.src;
                card.classList.add("is-previewing");
                thumbBox.classList.add("is-previewing");
            };
            const hidePreview = () => {
                card.classList.remove("is-previewing");
                thumbBox.classList.remove("is-previewing");
                window.clearTimeout(clearTimer);
                clearTimer = window.setTimeout(() => {
                    if (useIframe) preview.removeAttribute("src");
                }, 320);
            };

            thumbBox.addEventListener("pointerenter", showPreview);
            thumbBox.addEventListener("pointerleave", hidePreview);
            thumbBox.addEventListener("click", (event) => {
                if (thumbBox.dataset.previewKind === "iframe" && thumbBox.classList.contains("is-previewing")) {
                    event.stopPropagation();
                }
            });
            card.addEventListener("focusin", showPreview);
            card.addEventListener("focusout", hidePreview);
        }

        function buildMeta(sectionKey, values) {
            const parts = [];
            if (sectionKey === "mediaTrend") {
                if (values.viewerCount > 0 || values.viewCount > 0) {
                    parts.push(`시청자 ${formatCount(values.viewerCount || values.viewCount)}`);
                } else if (values.viewTime) {
                    parts.push(values.viewTime);
                }
            } else if (values.viewCount > 0) {
                parts.push(`조회 ${formatCount(values.viewCount)}`);
            }

            if (sectionKey === "naverCafe") {
                if (values.recommendCount > 0) parts.push(`좋아요 ${formatCount(values.recommendCount)}`);
            } else {
                if (values.recommendCount > 0) parts.push(`추천 ${formatCount(values.recommendCount)}`);
            }

            if (values.commentCount > 0) parts.push(`댓글 ${formatCount(values.commentCount)}`);
            if (values.source) parts.push(values.source);
            return parts.join(" · ");
        }

        function getItemSource(item, sectionKey) {
            if (sectionKey === "naverCafe") {
                return firstText(item.cafeName, item.source, sections[sectionKey].label);
            }

            if (sectionKey === "mediaTrend") {
                const platform = firstText(item.platformName, item.source, item.siteName);
                const channel = firstText(item.channelName, item.boardName);
                if (platform && channel && platform !== channel) return `${platform} · ${channel}`;
                return firstText(platform, channel, sections[sectionKey].label);
            }

            return firstText(item.communityName, item.source, item.siteName, item.boardName, sections[sectionKey].label);
        }

        function getMediaPreviewUrl(item, link, sectionKey) {
            if (sectionKey !== "mediaTrend") return "";

            const explicitUrl = safeUrl(firstText(item.previewUrl, item.livePreviewUrl, item.embedUrl, item.playerUrl));
            if (explicitUrl) return explicitUrl;

            const target = safeUrl(link);
            if (!target) return "";

            try {
                const url = new URL(target);
                const parts = url.pathname.split("/").filter(Boolean);

                if (/^(play|live)\.sooplive\.(com|co\.kr)$/.test(url.hostname) && parts.length >= 2) {
                    return withPreviewAutoplay(`https://play.sooplive.com/${encodeURIComponent(parts[0])}/${encodeURIComponent(parts[1])}/embed`);
                }

                if (url.hostname === "chzzk.naver.com" && parts[0] === "live" && parts[1]) {
                    return withPreviewAutoplay(`https://chzzk.naver.com/embed/live/${encodeURIComponent(parts[1])}`);
                }
            } catch {
                return "";
            }

            return "";
        }

        function getMediaPreviewType(item, sectionKey) {
            if (sectionKey !== "mediaTrend") return "";

            const explicitType = firstText(item.previewType, item.previewKind).toLowerCase();
            if (explicitType === "iframe" || explicitType === "image") return explicitType;

            const platform = firstText(item.platformName, item.source, item.siteName).toLowerCase();
            if (platform.includes("soop")) return "image";
            if (platform.includes("치지직") || platform.includes("chzzk")) return "image";
            return "image";
        }

        function withPreviewAutoplay(value) {
            const target = safeUrl(value);
            if (!target) return "";

            try {
                const url = new URL(target);
                url.searchParams.set("autoplay", "1");
                url.searchParams.set("mute", "0");
                url.searchParams.set("muted", "0");
                return url.toString();
            } catch {
                return target;
            }
        }

        function findDataList(keys) {
            for (const key of keys || []) {
                const list = normalizeList(rawDataStore[key]);
                if (list.length > 0) return list;
            }
            return [];
        }

        function normalizeList(value) {
            const list = Array.isArray(value) ? value : Object.values(value || {});
            return list
                .filter(Boolean)
                .sort((a, b) => firstNumber(a.rank, a.naverRank, 999) - firstNumber(b.rank, b.naverRank, 999));
        }

        function showEmpty(message) {
            grid.innerHTML = "";
            const empty = document.createElement("p");
            empty.className = "empty-state";
            empty.textContent = message;
            grid.appendChild(empty);
        }

        function getActiveSection() {
            return sections[activeSection] || sections.mediaTrend;
        }

        function getActiveFeed() {
            const section = getActiveSection();
            const feedKey = activeFeedBySection[activeSection];
            return section.feeds.find((feed) => feed.key === feedKey) || section.feeds[0];
        }

        function setActiveSection(sectionKey) {
            activeSection = sectionKey;
            document.querySelectorAll(".main-tab-btn").forEach((button) => {
                button.classList.toggle("active", button.dataset.section === sectionKey);
            });
            renderFeedTabs();
            paintCards();
        }

        function firstText(...values) {
            return values.find((value) => String(value || "").trim()) || "";
        }

        function firstNumber(...values) {
            for (const value of values) {
                const number = Number(value);
                if (Number.isFinite(number) && number > 0) return number;
            }
            return 0;
        }

        function formatCount(value) {
            const number = Number(value || 0);
            if (number >= 10000) return `${Math.round((number / 10000) * 10) / 10}만`;
            return number.toLocaleString("ko-KR");
        }

        function safeUrl(value) {
            const raw = String(value || "").trim();
            if (/^data:image\/(?:png|jpe?g|gif|webp);base64,[a-z0-9+/]+=*$/i.test(raw)) {
                return raw;
            }

            try {
                const url = new URL(raw);
                return ["http:", "https:"].includes(url.protocol) ? url.toString() : "";
            } catch {
                return "";
            }
        }

        function formatTime(date) {
            return new Intl.DateTimeFormat("ko-KR", {
                hour: "2-digit",
                minute: "2-digit"
            }).format(date);
        }

        function openArticle(link) {
            const target = safeUrl(link);
            if (target) window.location.href = target;
        }

        document.querySelectorAll(".main-tab-btn").forEach((button) => {
            button.addEventListener("click", () => setActiveSection(button.dataset.section));
        });

        renderFeedTabs();
        fetchSystem();
        setInterval(fetchSystem, syncIntervalMs);
    </script>
</body>
</html>
