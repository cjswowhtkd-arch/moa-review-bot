<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모아리뷰 실시간 트렌드 허브</title>
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: #131926;
            --border-color: #222d44;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --point-color: #06b6d4;
            --gradient-accent: linear-gradient(135deg, #06b6d4, #3b82f6);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-title);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .header-section {
            text-align: center;
            margin: 25px 0 35px 0;
        }

        .header-section h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px 0;
        }

        .header-section p {
            color: var(--text-body);
            font-size: 14px;
            margin: 0;
        }

        /* 📱 모바일 가로 스크롤 특화 탭 바 */
        .tab-wrapper {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            overflow-x: auto;
            display: flex;
            gap: 8px;
            padding: 5px 0 12px 0;
            -webkit-overflow-scrolling: touch;
        }
        
        .tab-wrapper::-webkit-scrollbar {
            display: none; /* 크롬, 사파리 스크롤바 숨김 */
        }

        .tab-btn {
            flex: 0 0 auto; /* 모바일에서 찌그러지지 않도록 고정 */
            background-color: var(--card-bg);
            color: var(--text-body);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--gradient-accent);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        /* 반응형 그리드 시스템 (TOP 1~20 나열) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .trend-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .trend-card:hover {
            transform: translateY(-4px);
            border-color: var(--point-color);
        }

        /* 🌟 썸네일 이미지 공간 */
        .thumb-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #0f1420;
            position: relative;
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .trend-card:hover .thumb-box img {
            transform: scale(1.05);
        }

        /* 순위 마크 표시 */
        .rank-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(4px);
            color: #ec4899;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-body h3 {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.42;
            margin: 0 0 10px 0;
            color: var(--text-title);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-body p {
            font-size: 12.5px;
            color: var(--text-body);
            line-height: 1.5;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 모바일 터치 대응 모달창 크기 최적화 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-window {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            position: relative;
        }

        .modal-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .modal-info {
            padding: 20px;
        }

        .modal-info h2 {
            font-size: 17px;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .modal-info p {
            color: var(--text-body);
            font-size: 13px;
            line-height: 1.6;
            margin: 0 0 20px 0;
        }

        .action-link {
            display: block;
            text-align: center;
            background: var(--gradient-accent);
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }

        .close-icon {
            position: absolute;
            top: 12px; right: 15px;
            font-size: 24px; color: white;
            cursor: pointer; z-index: 10;
            background: rgba(0,0,0,0.5);
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>🌐 모아리뷰 실시간 트렌드</h1>
        <p>가장 공신력 있는 데이터 기준 TOP 1~20 종합 인덱스</p>
    </div>

    <div class="tab-wrapper">
        <button id="tab-drama" class="tab-btn active" onclick="changeCategory('drama')">📺 드라마/웹툰</button>
        <button id="tab-tech" class="tab-btn" onclick="changeCategory('tech')">💻 IT/테크</button>
        <button id="tab-dessert" class="tab-btn" onclick="changeCategory('dessert')">🍰 디저트 핫플</button>
        <button id="tab-news" class="tab-btn" onclick="changeCategory('news')">📰 주요 종합뉴스</button>
        <button id="tab-stock" class="tab-btn" onclick="changeCategory('stock')">📈 증시 특징주</button>
    </div>

    <div class="grid-container" id="cardGrid">
        <p style="text-align: center; width: 100%; color: var(--text-body); font-size:13px;">동적 데이터를 파싱하고 있습니다...</p>
    </div>

    <div id="detailModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-window" onclick="event.stopPropagation()">
            <span class="close-icon" onclick="closeModal()">&times;</span>
            <img id="modalImg" class="modal-thumb" src="" alt="썸네일">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalContent"></p>
                <a id="modalGoBtn" href="#" target="_blank" class="action-link">검증 원문 기사 바로보기 ➔</a>
            </div>
        </div>
    </div>

    <script type="module">
        const dbEndpoint = "https://chosanghee00001-default-rtdb.firebaseio.com/categories.json";
        let activeTab = 'drama';
        let rawDataStore = {};

        async function fetchSystem() {
            try {
                const res = await fetch(dbEndpoint);
                rawDataStore = await res.json() || {};
                paintCards();
            } catch (err) {
                document.getElementById('cardGrid').innerHTML = '<p style="text-align:center; width:100%; color:var(--text-body);">실시간 트렌드를 동기화하는 데 대기 시간이 필요합니다.</p>';
            }
        }

        function paintCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            const activeList = rawDataStore[activeTab] || [];

            if(activeList.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-body);">현재 데이터가 비어있습니다. 로봇을 가동해 주세요.</p>';
                return;
            }

            activeList.forEach((item, index) => {
                if (!item) return;
                const parcel = encodeURIComponent(JSON.stringify(item));
                
                grid.innerHTML += `
                    <div class="trend-card" onclick="openModal('${parcel}')">
                        <div class="thumb-box">
                            <span class="rank-badge">TOP ${index + 1}</span>
                            <img src="${item.img}" alt="뉴스 기사 이미지" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=500&q=80'">
                        </div>
                        <div class="card-body">
                            <h3>${item.title}</h3>
                            <p>${item.content}</p>
                        </div>
                    </div>
                `;
            });
        }

        window.changeCategory = function(targetKey) {
            activeTab = targetKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${targetKey}`).classList.add('active');
            paintCards();
        }

        window.openModal = function(parcelData) {
            const parsed = JSON.parse(decodeURIComponent(parcelData));
            document.getElementById('modalImg').src = parsed.img;
            document.getElementById('modalTitle').innerText = parsed.title;
            document.getElementById('modalContent').innerText = parsed.content;
            document.getElementById('modalGoBtn').href = parsed.link;
            document.getElementById('detailModal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('detailModal').style.display = 'none';
        }

        fetchSystem();
    </script>
</body>
</html>
